<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shiny Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script type="module">
      import { animate, stagger } from "https://cdn.jsdelivr.net/npm/motion@latest/+esm";
      window.Motion = { animate: animate, stagger: stagger };
    </script>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="stars"></div>
    <div class="app">
      <div class="dex-clamshell" id="dex-clamshell" data-active="hunts">
        <div class="dex-frame">
          <div class="dex-track">
          <div id="view-hunts" class="dex-page">
            <div class="hunts" id="hunts-list"></div>
          </div>

          <div id="view-collection" class="dex-page">
            <div class="log-dex-shell-wrap">
              <div class="log-dex-shell" id="log-dex-shell" data-log-mode="card" data-log-hof="false">
                <div class="log-dex-shell-crease-wrap"><div class="log-dex-shell-crease"></div></div>

                <div class="log-mode-toggle" id="log-mode-toggle">
                  <button type="button" data-mode="card" class="active">Card</button>
                  <button type="button" data-mode="grid">Grid</button>
                </div>

                <div class="log-dex-screen-stack">
                  <div class="log-dex-screen" id="log-latest-screen"></div>
                  <div class="log-dex-screen log-grid-screen" id="log-grid-screen"></div>
                  <div class="log-dex-screen log-hof-screen" id="log-hof-screen"></div>
                </div>

                <div class="log-dex-toolbar" id="log-dex-toolbar">
                  <div class="dex-select-wrap" id="log-search-wrap">
                    <button type="button" class="log-dex-grid-btn" id="btn-log-search" title="Search" aria-label="Search">⌕</button>
                    <div class="dex-select-panel log-search-panel" id="log-search-panel">
                      <input type="text" id="log-search" class="log-key-input" placeholder="␣ filter your log...">
                    </div>
                  </div>
                  <div class="dex-select-wrap" id="log-sort-wrap">
                    <button type="button" class="log-dex-grid-btn" id="btn-log-sort" title="Sort">Newest ▾</button>
                    <div class="dex-select-panel" id="log-sort-panel">
                      <div class="dex-select-option active" data-value="newest">Newest</div>
                      <div class="dex-select-option" data-value="oldest">Oldest</div>
                      <div class="dex-select-option" data-value="rarest">Rarest Odds</div>
                      <div class="dex-select-option" data-value="fastest">Fastest Catch</div>
                      <div class="dex-select-option" data-value="most">Most Encounters</div>
                    </div>
                  </div>
                  <div class="dex-select-wrap" id="log-filter-wrap">
                    <button type="button" class="log-dex-grid-btn" id="btn-log-filter" title="Filter">All ▾</button>
                    <div class="dex-select-panel log-filter-panel" id="log-filter-panel">
                      <div class="log-filter-group">
                        <label class="log-filter-group-label" for="log-filter-game">Game</label>
                        <select id="log-filter-game"><option value="">All Games</option></select>
                      </div>
                      <div class="log-filter-group">
                        <label class="log-filter-group-label" for="log-filter-method">Method</label>
                        <select id="log-filter-method"><option value="">All Methods</option></select>
                      </div>
                      <div class="log-filter-group">
                        <label class="log-filter-group-label" for="log-filter-gen">Generation</label>
                        <select id="log-filter-gen"><option value="">All Gens</option></select>
                      </div>
                      <button type="button" class="ghost log-filter-clear" id="btn-log-filter-clear">Clear Filters</button>
                    </div>
                  </div>
                  <button type="button" class="log-dex-grid-btn log-dex-grid-hof" id="btn-log-hof" title="Hall of Fame" aria-pressed="false"><span class="log-dex-grid-hof-icon">★</span></button>
                  <button type="button" class="log-dex-grid-btn" id="btn-toggle-log-edit" title="Edit Shiny Log" aria-label="Edit Shiny Log" aria-pressed="false">✎</button>
                  <button type="button" class="log-dex-grid-btn" id="btn-log-reset-filters" title="Reset Filters" aria-label="Reset all filters">⟲</button>
                </div>
                <div class="log-dex-row">
                  <button type="button" class="log-dex-pill" id="btn-log-to-livingdex-1" title="Living Dex" aria-label="Go to Living Dex">
                    <span class="log-dex-pill-rivet rivet-tl" aria-hidden="true"></span>
                    <span class="log-dex-pill-rivet rivet-br" aria-hidden="true"></span>
                    <span class="log-dex-pill-icon" aria-hidden="true">
                      <svg viewBox="0 0 24 24" width="27" height="27" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="9" fill="currentColor" opacity="0.15"/>
                        <path d="M3 12a9 9 0 0 1 18 0" fill="currentColor" opacity="0.55"/>
                        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" fill="none"/>
                        <path d="M3 12H9M15 12H21" stroke="currentColor" stroke-width="1.8"/>
                        <circle cx="12" cy="12" r="2.6" fill="#182463" stroke="currentColor" stroke-width="1.8"/>
                      </svg>
                    </span>
                    <span class="log-dex-pill-label">Living Dex</span>
                    <span class="log-dex-pill-count" id="log-dex-pill-count">0 / 0</span>
                    <span class="log-dex-pill-leds" aria-hidden="true"><span></span><span></span><span></span></span>
                    <span class="log-dex-pill-arrow" aria-hidden="true">→</span>
                  </button>
                </div>
                <div class="log-dex-nav">
                  <button class="log-dex-nav-btn" id="log-screen-prev" aria-label="Show previous catch">◀&#xFE0E;</button>
                  <button class="log-dex-nav-btn" id="log-screen-next" aria-label="Show next catch">▶&#xFE0E;</button>
                </div>
              </div>
            </div>

          </div>
          </div>
        </div>
      <div id="view-livingdex" class="dex-page">
        <div class="pc-scene">
          <!-- Mobile-only closed Pokédex cover: a decorative red-shell overlay
               shown before the Living Dex is opened. Tapping/activating it
               (or, once open, tapping the lens in .dex-handheld-topbar) toggles
               '.livingdex-open' on .pc-scene, which flips this cover away via
               CSS (see style.css). Hidden entirely on desktop. -->
          <div class="dex-closed-cover" id="dex-closed-cover" role="button" tabindex="0" aria-label="Open Living Dex" aria-expanded="false">
            <span class="dex-closed-stud dex-closed-stud-top" aria-hidden="true"></span>
            <span class="dex-closed-stud dex-closed-stud-bottom" aria-hidden="true"></span>
            <div class="dex-closed-band" aria-hidden="true">
              <div class="dex-closed-ring">
                <div class="dex-closed-core"></div>
              </div>
            </div>
          </div>
          <div class="pc-monitor">
            <!-- Handheld Pokédex chrome: hidden on desktop, shown only at the
                 mobile breakpoint (see style.css) where the PC monitor is swapped
                 for a red clamshell Pokédex shape instead. Purely decorative - no
                 ids, no script.js dependency. -->
            <div class="dex-handheld-topbar">
              <div class="dex-handheld-lens"><span class="dex-handheld-lens-glint"></span></div>
              <div class="dex-handheld-lights">
                <span class="dex-handheld-light g lit"></span>
                <span class="dex-handheld-light y"></span>
                <span class="dex-handheld-light r"></span>
              </div>
              <div class="dex-handheld-brand">POKÉDEX</div>
            </div>
            <div class="pc-monitor-vents">
              <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            </div>
            <div class="pc-monitor-topbar">
              <div class="pc-brand-text">POKÉMON STORAGE SYSTEM</div>
              <div class="pc-power">
                <span class="pc-power-light"></span>
                <span class="pc-power-label">ON</span>
              </div>
            </div>
            <div class="pc-screen-bezel">
              <button type="button" class="dex-toggle-back-btn" title="Back to Active Hunts" aria-label="Back to Active Hunts">←</button>
              <div class="pc-screen">
                <div class="pc-screen-content">
                  <div class="dex-split-toggle" id="dex-mode-toggle"></div>
                  <div class="dex-grid" id="dex-grid"></div>
                </div>
                <div class="pc-scanlines"></div>
                <div class="pc-screen-glare"></div>
              </div>
            </div>
          </div>

          <div class="pc-keyboard-tray">
            <!-- Decorative D-pad + A/B buttons for the mobile handheld Pokédex
                 layout (hidden on desktop, where the QWERTY deco-keys below are
                 used instead). Purely decorative, no script.js dependency. -->
            <div class="dex-handheld-controls" aria-hidden="true">
              <div class="dex-handheld-dpad">
                <span class="dpad-up"></span>
                <span class="dpad-right"></span>
                <span class="dpad-down"></span>
                <span class="dpad-left"></span>
                <span class="dpad-center"></span>
              </div>
              <div class="dex-handheld-ab">
                <span class="dex-handheld-btn a">A</span>
                <span class="dex-handheld-btn b">B</span>
              </div>
            </div>
            <div class="pc-keyboard-slit"></div>
            <div class="pc-deco-keys" aria-hidden="true">
              <div class="pc-deco-row">
                <span>Q</span><span>W</span><span>E</span><span>R</span><span>T</span>
                <span>Y</span><span>U</span><span>I</span><span>O</span><span>P</span>
              </div>
              <div class="pc-deco-row pc-deco-row-2">
                <span>A</span><span>S</span><span>D</span><span>F</span><span>G</span>
                <span>H</span><span>J</span><span>K</span><span>L</span>
              </div>
              <div class="pc-deco-row pc-deco-row-3">
                <span>Z</span><span>X</span><span>C</span><span>V</span><span>B</span><span>N</span><span>M</span>
              </div>
            </div>
            <div class="pc-key-row pc-key-row-space">
              <div class="pc-key pc-key-search">
                <div class="field dex-search-field">
                  <input type="text" id="dex-search" placeholder="␣ jump to a species...">
                </div>
              </div>
            </div>
            <div class="pc-key-row pc-key-row-fn">
              <div class="pc-key pc-key-fn">
                <span class="pc-key-label">Sort</span>
                <div class="dex-select-wrap" id="dex-sort-wrap">
                  <button class="ghost" id="btn-dex-sort" type="button">Sort: Dex Number ▾</button>
                  <div class="dex-select-panel" id="dex-sort-panel">
                    <div class="dex-select-option active" data-value="dex">Dex Number</div>
                    <div class="dex-select-option" data-value="alpha">A--Z</div>
                    <div class="dex-select-option" data-value="uncaught">Uncaught First</div>
                  </div>
                </div>
              </div>
              <div class="pc-key pc-key-fn">
                <span class="pc-key-label">Type</span>
                <div class="dex-select-wrap" id="dex-type-wrap">
                  <button class="ghost" id="btn-dex-type-filter" type="button">Filter: All Types ▾</button>
                  <div class="dex-select-panel" id="dex-type-panel">
                    <div class="dex-select-option active" data-value="">All Types</div>
                    <div class="dex-select-option" data-value="Normal"><span class="type-swatch" style="background:#A8A878"></span>Normal</div>
                    <div class="dex-select-option" data-value="Fire"><span class="type-swatch" style="background:#F08030"></span>Fire</div>
                    <div class="dex-select-option" data-value="Water"><span class="type-swatch" style="background:#6890F0"></span>Water</div>
                    <div class="dex-select-option" data-value="Electric"><span class="type-swatch" style="background:#F8D030"></span>Electric</div>
                    <div class="dex-select-option" data-value="Grass"><span class="type-swatch" style="background:#78C850"></span>Grass</div>
                    <div class="dex-select-option" data-value="Ice"><span class="type-swatch" style="background:#98D8D8"></span>Ice</div>
                    <div class="dex-select-option" data-value="Fighting"><span class="type-swatch" style="background:#C03028"></span>Fighting</div>
                    <div class="dex-select-option" data-value="Poison"><span class="type-swatch" style="background:#A040A0"></span>Poison</div>
                    <div class="dex-select-option" data-value="Ground"><span class="type-swatch" style="background:#E0C068"></span>Ground</div>
                    <div class="dex-select-option" data-value="Flying"><span class="type-swatch" style="background:#A890F0"></span>Flying</div>
                    <div class="dex-select-option" data-value="Psychic"><span class="type-swatch" style="background:#F85888"></span>Psychic</div>
                    <div class="dex-select-option" data-value="Bug"><span class="type-swatch" style="background:#A8B820"></span>Bug</div>
                    <div class="dex-select-option" data-value="Rock"><span class="type-swatch" style="background:#B8A038"></span>Rock</div>
                    <div class="dex-select-option" data-value="Ghost"><span class="type-swatch" style="background:#705898"></span>Ghost</div>
                    <div class="dex-select-option" data-value="Dragon"><span class="type-swatch" style="background:#7038F8"></span>Dragon</div>
                    <div class="dex-select-option" data-value="Dark"><span class="type-swatch" style="background:#705848"></span>Dark</div>
                    <div class="dex-select-option" data-value="Steel"><span class="type-swatch" style="background:#B8B8D0"></span>Steel</div>
                    <div class="dex-select-option" data-value="Fairy"><span class="type-swatch" style="background:#EE99AC"></span>Fairy</div>
                  </div>
                </div>
              </div>
              <div class="pc-key pc-key-fn">
                <span class="pc-key-label">Forms</span>
                <div class="variant-filter-wrap" id="variant-filter-wrap">
                  <button class="ghost" id="btn-variant-filter" type="button">Filter: Variants ▾</button>
                  <div class="variant-filter-panel" id="variant-filter-panel">
                    <div class="variant-filter-option">
                      <input type="checkbox" id="vf-original" checked>
                      <label for="vf-original">Original</label>
                    </div>
                    <div class="variant-filter-option">
                      <input type="checkbox" id="vf-alolan" checked>
                      <label for="vf-alolan"><span class="dex-chip-tag dex-chip-tag-alolan">ALOLAN</span></label>
                    </div>
                    <div class="variant-filter-option">
                      <input type="checkbox" id="vf-galarian" checked>
                      <label for="vf-galarian"><span class="dex-chip-tag dex-chip-tag-galarian">GALARIAN</span></label>
                    </div>
                    <div class="variant-filter-option">
                      <input type="checkbox" id="vf-hisuian" checked>
                      <label for="vf-hisuian"><span class="dex-chip-tag dex-chip-tag-hisuian">HISUIAN</span></label>
                    </div>
                    <div class="variant-filter-option">
                      <input type="checkbox" id="vf-paldean" checked>
                      <label for="vf-paldean"><span class="dex-chip-tag dex-chip-tag-paldean">PALDEAN</span></label>
                    </div>
                    <div class="variant-filter-actions">
                      <button type="button" class="ghost" id="vf-select-all">All</button>
                      <button type="button" class="ghost" id="vf-select-none">None</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Mobile-only Kalos-style Pokédex clamshell: a two-piece hinge
               (top shell half / bottom shell half) that starts flush together
               (closed), and on tap slides the top half up and the bottom half
               down - neither piece disappears, they just come to rest at the
               top/bottom edges of the now-taller shell, revealing the sunken
               screen (gen tiles, then a single gen's Pokémon list) between
               them. Entirely separate markup from the desktop .pc-monitor/
               .pc-keyboard-tray above - hidden on desktop, and the old
               .pc-monitor/.pc-keyboard-tray/.dex-closed-cover are hidden at
               the mobile breakpoint instead (see CSS-KALOS-MOBILE in
               style.css). No ids/classes are shared with the desktop markup
               except the reused .dex-split-toggle / .dex-chip /
               .dex-species-grid / .dex-gen-badge look, which already exists in
               style.css and just gets inherited here. -->
          <div class="kalos-dex" id="kalos-dex" data-open="false">
            <div class="kalos-shell-half kalos-top" id="kalos-top" role="button" tabindex="0" aria-label="Open Living Dex" aria-expanded="false">
              <span class="kalos-fill" aria-hidden="true"></span>
              <span class="kalos-corner kalos-corner-tl" aria-hidden="true"></span>
              <span class="kalos-corner kalos-corner-tr" aria-hidden="true"></span>
              <span class="kalos-corner kalos-corner-big kalos-corner-tl" aria-hidden="true"></span>
              <span class="kalos-corner kalos-corner-big kalos-corner-tr" aria-hidden="true"></span>
              <span class="kalos-band-half kalos-band-top" aria-hidden="true"></span>
              <span class="kalos-rail-half kalos-rail-top" aria-hidden="true"></span>
              <span class="kalos-lens kalos-lens-top" aria-hidden="true"></span>
              <!-- Back-to-Active-Hunts control, mounted as a real shoulder
                   button on the shell's top-left corner (nested in the
                   engraved corner grooves above) instead of floating on the
                   screen glass in .kalos-screen-wrap - reads as part of the
                   case, not a UI overlay. No arrow glyph inside it (just a
                   plain hardware button) - the label/title still say what
                   it does for screen readers and on hover. Still shares the
                   .dex-toggle-back-btn class so the existing click wiring
                   (script.js) picks it up automatically; .kalos-shell-back-btn
                   only adds the shell-mounted position/look at the mobile
                   breakpoint (see CSS-KALOS-MOBILE in style.css). -->
              <button type="button" class="dex-toggle-back-btn kalos-shell-back-btn" title="Back to Active Hunts" aria-label="Back to Active Hunts"></button>
            </div>
            <span class="kalos-seam" aria-hidden="true">
              <span class="kalos-seam-ring"><span class="kalos-seam-core"></span></span>
            </span>
            <div class="kalos-screen-wrap" id="kalos-screen-wrap">
              <div class="kalos-screen">
                <div class="kalos-screen-content">
                  <div class="dex-split-toggle kalos-mode-toggle" id="kalos-mode-toggle"></div>
                  <!-- Each .kalos-gen-tile is built entirely in script.js
                       (renderKalosMobileDex). Tapping a collapsed tile grows
                       it, in its own grid slot, into the same
                       .dex-card/.dex-card-banner/.dex-species-panel markup
                       the desktop accordion uses (so it inherits the exact
                       same per-generation banner + region background images
                       for free) - the other tiles just disappear rather
                       than the expanded one flying off to a separate panel. -->
                  <div class="kalos-gen-grid" id="kalos-gen-grid"></div>
                  <!-- Dot indicators for the peek carousel above, one per
                       generation - built/kept in sync in script.js
                       (buildKalosDots/updateKalosDots) and hidden whenever
                       a tile is expanded (see renderKalosMobileDex). -->
                  <div class="kalos-gen-dots" id="kalos-gen-dots"></div>
                </div>
                <div class="pc-scanlines"></div>
                <div class="pc-screen-glare"></div>
              </div>
            </div>
            <div class="kalos-shell-half kalos-bottom" id="kalos-bottom" role="button" tabindex="0" aria-label="Close Living Dex" aria-expanded="false">
              <span class="kalos-fill" aria-hidden="true"></span>
              <span class="kalos-band-half kalos-band-bottom" aria-hidden="true"></span>
              <span class="kalos-rail-half kalos-rail-bottom" aria-hidden="true"></span>
              <span class="kalos-lens kalos-lens-bottom" aria-hidden="true"></span>
              <span class="kalos-corner kalos-corner-bl" aria-hidden="true"></span>
              <span class="kalos-corner kalos-corner-br" aria-hidden="true"></span>
              <span class="kalos-corner kalos-corner-big kalos-corner-bl" aria-hidden="true"></span>
              <span class="kalos-corner kalos-corner-big kalos-corner-br" aria-hidden="true"></span>
            </div>
          </div>
        </div>
      </div>
      </div>
    </div>
    <!-- Firebase (used to sync your tracker data across devices via Firestore) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script>
      // Firebase project config (Firebase console > Project settings > General).
      var firebaseConfig = {
        apiKey: "AIzaSyDX0UpFkZWQH98w8GuzU9PAD0UJRQte8do",
        authDomain: "shinytracker-9128f.firebaseapp.com",
        projectId: "shinytracker-9128f",
        storageBucket: "shinytracker-9128f.firebasestorage.app",
        messagingSenderId: "465878753061",
        appId: "1:465878753061:web:8f17830985c56a2ec444cc",
        measurementId: "G-77C8511J0P"
      };
      try {
        firebase.initializeApp(firebaseConfig);
      } catch (e) {
        console.error('Firebase init failed - check firebaseConfig', e);
      }
    </script>
    <script src="script.js"></script>
  </body>
</html>
